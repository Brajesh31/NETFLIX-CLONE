name: Feature request
description: Suggest a static UI, accessibility, or responsive improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: rationale
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
